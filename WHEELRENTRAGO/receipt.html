<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#ff5540"/>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<title>WheelRentraGo | Receipt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{ colors:{ "outline-variant":"#603e39","on-background":"#e5e2e1","surface-variant":"#353534","secondary":"#d3fbff","on-primary":"#690100","surface-container":"#201f1f","primary":"#ffb4a8","primary-container":"#ff5540","on-primary-container":"#5c0000","on-surface":"#e5e2e1","error":"#ffb4ab","secondary-container":"#00eefc","surface-container-low":"#1c1b1b","surface-container-lowest":"#0e0e0e","surface-container-high":"#2a2a2a","on-surface-variant":"#ebbbb4","surface":"#131313","background":"#131313","on-secondary-container":"#00686f" },
  fontFamily:{ "label-mono":["JetBrains Mono"],"display-lg":["Space Grotesk"],"headline-lg":["Space Grotesk"],"body-md":["Geist"] },
  fontSize:{ "label-mono":["12px",{lineHeight:"16px",fontWeight:"500"}],"display-lg":["36px",{lineHeight:"44px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-lg":["24px",{lineHeight:"32px",letterSpacing:"0.02em",fontWeight:"700"}] } } }
}
</script>
<style>
  body { background-color:#0b0b0b; color:#e5e2e1; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .chamfer-sm { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  @media print {
    body { background:#fff !important; color:#111 !important; }
    #no-print { display:none !important; }
    #receipt-card { border:1px solid #999 !important; box-shadow:none !important; color:#111 !important; }
    #receipt-card * { color:#111 !important; border-color:#ccc !important; }
    #receipt-card .accent { color:#c23c2e !important; }
  }
</style>
</head>
<body class="font-body-md min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md">

  <div id="no-print" class="flex items-center justify-between mb-4">
    <a href="dashboard.html" class="font-label-mono text-[10px] text-on-surface-variant/60 uppercase hover:text-primary transition-colors">&larr; Back</a>
    <button onclick="window.print()" class="flex items-center gap-2 px-4 py-2 bg-primary-container text-on-primary-container font-label-mono text-[10px] uppercase font-bold chamfer-sm hover:brightness-110 transition-all">
      <span class="material-symbols-outlined text-sm">print</span> Print / Save as PDF
    </button>
  </div>

  <div id="receipt-card" class="bg-surface-container-low border border-outline-variant chamfer-sm p-8">
    <div class="flex items-start justify-between mb-6 pb-4 border-b border-outline-variant">
      <div>
        <div class="font-headline-lg text-headline-lg font-bold text-primary accent italic uppercase tracking-tighter">WheelRentraGo</div>
        <div class="font-label-mono text-[9px] text-on-surface-variant uppercase tracking-widest mt-1">Digital Receipt / Invoice</div>
      </div>
      <div class="text-right">
        <div class="font-label-mono text-[9px] text-on-surface-variant/60 uppercase">Receipt No.</div>
        <div id="r-receiptno" class="font-label-mono text-xs text-secondary accent">—</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6 font-label-mono text-xs">
      <div>
        <div class="text-on-surface-variant/60 uppercase text-[9px] mb-0.5">Billed to</div>
        <div id="r-name" class="text-on-background">—</div>
        <div id="r-email" class="text-on-surface-variant/60">—</div>
      </div>
      <div class="text-right">
        <div class="text-on-surface-variant/60 uppercase text-[9px] mb-0.5">Issued</div>
        <div id="r-issued" class="text-on-background">—</div>
        <div class="text-on-surface-variant/60 uppercase text-[9px] mt-1">Status: <span id="r-status" class="text-secondary accent">—</span></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6 font-label-mono text-xs -mt-2">
      <div>
        <div class="text-on-surface-variant/60 uppercase text-[9px] mb-0.5">Payment Method</div>
        <div id="r-paymethod" class="text-on-background">—</div>
      </div>
      <div class="text-right">
        <div class="text-on-surface-variant/60 uppercase text-[9px] mb-0.5">Payment Ref.</div>
        <div id="r-payref" class="text-secondary accent">—</div>
      </div>
    </div>

    <table class="w-full font-label-mono text-xs mb-4">
      <thead>
        <tr class="border-b border-outline-variant text-on-surface-variant/60 uppercase text-[9px]">
          <th class="text-left py-2">Item</th>
          <th class="text-right py-2">Qty</th>
          <th class="text-right py-2">Rate</th>
          <th class="text-right py-2">Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b border-outline-variant/30">
          <td class="py-3" id="r-vehicle">—</td>
          <td class="text-right py-3" id="r-days">—</td>
          <td class="text-right py-3" id="r-rate">—</td>
          <td class="text-right py-3" id="r-subtotal">—</td>
        </tr>
        <tr class="border-b border-outline-variant/30">
          <td class="py-3" colspan="3">Security deposit (refundable hold)</td>
          <td class="text-right py-3" id="r-deposit">—</td>
        </tr>
      </tbody>
    </table>

    <div class="flex justify-between items-center pt-3 border-t border-outline-variant">
      <span class="font-label-mono text-xs text-on-surface-variant uppercase">Total Charged</span>
      <span id="r-total" class="font-display-lg text-2xl text-primary accent">₱0</span>
    </div>

    <p class="font-label-mono text-[9px] text-on-surface-variant/40 uppercase text-center mt-6 pt-4 border-t border-outline-variant/40">
      Generated automatically by WheelRentraGo · Booking ID <span id="r-bookingid">—</span>
    </p>
  </div>

  <div id="r-error" class="hidden mt-4 p-4 border border-error/40 text-error font-label-mono text-xs text-center chamfer-sm"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const bookingId = params.get('bookingId') || params.get('id');

  function peso(n) { return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2 }); }

  if (!bookingId) {
    document.getElementById('r-error').textContent = 'No booking specified. Open this page from "My Bookings" with a valid receipt link.';
    document.getElementById('r-error').classList.remove('hidden');
  } else {
    WRG.api.getReceiptData(bookingId).then(r => {
      document.getElementById('r-receiptno').textContent = r.receiptNo;
      document.getElementById('r-name').textContent = r.riderName;
      document.getElementById('r-email').textContent = r.riderEmail;
      document.getElementById('r-issued').textContent = new Date(r.issuedAt).toLocaleString('en-PH');
      document.getElementById('r-status').textContent = String(r.status || '—').toUpperCase();
      document.getElementById('r-paymethod').textContent = r.paymentMethod;
      document.getElementById('r-payref').textContent = r.paymentRef;
      document.getElementById('r-vehicle').textContent = r.vehicleName + (r.vehicleType ? ' (' + r.vehicleType + ')' : '');
      document.getElementById('r-days').textContent = r.days;
      document.getElementById('r-rate').textContent = peso(r.ratePerDay);
      document.getElementById('r-subtotal').textContent = peso(r.subtotal);
      document.getElementById('r-deposit').textContent = peso(r.deposit);
      document.getElementById('r-total').textContent = peso(r.total);
      document.getElementById('r-bookingid').textContent = r.bookingId;
      document.title = r.receiptNo + ' — WheelRentraGo Receipt';
    }).catch(err => {
      document.getElementById('r-error').textContent = err.message || 'Could not load this receipt.';
      document.getElementById('r-error').classList.remove('hidden');
    });
  }
</script>
</body></html>
